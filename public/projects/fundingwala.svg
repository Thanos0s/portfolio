<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="fwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="stellarGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#fwBg)" rx="12" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Retro Frame Header -->
  <rect x="40" y="40" width="720" height="40" rx="6" fill="#27272a" />
  <circle cx="65" cy="60" r="5" fill="#ef4444" />
  <circle cx="85" cy="60" r="5" fill="#f59e0b" />
  <circle cx="105" cy="60" r="5" fill="#10b981" />
  <text x="400" y="65" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">fundingwala01.vercel.app</text>

  <!-- Project Banner Center -->
  <g transform="translate(40, 95)">
    <rect width="720" height="300" rx="8" fill="#121215" stroke="#27272a" stroke-width="1" />
    
    <!-- Retro Pixel Badge -->
    <rect x="50" y="40" width="130" height="26" rx="4" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="1" />
    <text x="115" y="57" fill="#a78bfa" font-family="'Silkscreen', monospace" font-size="11" text-anchor="middle">STELLAR DAPP</text>

    <!-- Project Title -->
    <text x="50" y="115" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="34">FundingWala</text>
    <text x="50" y="145" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15">Crowdfunding Powered by Soroban Smart Contracts</text>

    <!-- Description Snippet -->
    <text x="50" y="185" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Connect Freighter, Albedo &amp; xBull • Donate XLM • Live Event Stream</text>

    <!-- Stat Badges -->
    <g transform="translate(50, 220)">
      <rect width="180" height="44" rx="6" fill="#1f1f23" stroke="#374151" stroke-width="1" />
      <text x="15" y="18" fill="#6b7280" font-family="sans-serif" font-size="10">NETWORK</text>
      <text x="15" y="34" fill="#e5e7eb" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Stellar Testnet</text>
    </g>

    <g transform="translate(245, 220)">
      <rect width="180" height="44" rx="6" fill="#1f1f23" stroke="#374151" stroke-width="1" />
      <text x="15" y="18" fill="#6b7280" font-family="sans-serif" font-size="10">CONTRACT SPEC</text>
      <text x="15" y="34" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Soroban v22</text>
    </g>

    <g transform="translate(440, 220)">
      <rect width="180" height="44" rx="6" fill="#1f1f23" stroke="#374151" stroke-width="1" />
      <text x="15" y="18" fill="#6b7280" font-family="sans-serif" font-size="10">FRONTEND</text>
      <text x="15" y="34" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">React + Tailwind</text>
    </g>
  </g>
</svg>
